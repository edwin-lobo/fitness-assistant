services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: fitness_assistant_test
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - "${PORTABLE_DB_PORT:-55432}:5432"
    volumes:
      - .:/workspace:ro
    working_dir: /workspace
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fitness_assistant_test"]
      interval: 2s
      timeout: 5s
      retries: 30
